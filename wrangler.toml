# Cloudflare Workers configuration
name = "color"
main = "worker/index.js"
compatibility_date = "2026-03-01"
assets = { directory = "dist", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "color-snapshots"
database_id = "39598343-0990-452e-a58e-be2a00a9470c"

[build]
command = "pnpm build"

[vars]
ALLOWED_ORIGINS = "https://color.53.workers.dev,https://color.pages.dev,http://localhost:5173,http://localhost:4173"

# Fail closed if this binding or TURNSTILE_SECRET is absent.
# Limits are per Cloudflare location, not a global billing cap.
[[unsafe.bindings]]
type = "ratelimit"
name = "SNAPSHOT_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
